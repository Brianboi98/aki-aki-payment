<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Aki-Aki Trip</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; --secondary: #10b981; --success: #10b981; --danger: #ef4444; 
            --admin-main: #4f46e5; --admin-light: #e0e7ff; --admin-dark: #3730a3;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border-light: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px 10px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { background: linear-gradient(135deg, var(--admin-main), var(--admin-dark)); border-radius: 12px; padding: 25px 20px; color: white; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
        .admin-badge { position: absolute; top: 15px; right: -35px; background: #ef4444; font-size: 11px; font-weight: bold; padding: 5px 40px; transform: rotate(45deg); letter-spacing: 1.5px; }
        .header h1 { font-size: 22px; margin-bottom: 8px; line-height: 1.3; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.9; }
        
        .db-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 15px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #fbbf24; } 
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-light); }
        .stat-card h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 600;}
        .stat-card .amount { font-size: 18px; font-weight: 700; }
        
        .table-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px; }
        .table-header-flex h3 { font-size: 15px; color: var(--admin-dark); }
        .btn-add { background: var(--admin-main); color: white; border: none; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
        .btn-add:active { transform: translateY(1px); }

        .table-wrapper { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-light); margin-bottom: 20px; overflow-x: auto; }
        table { width: 100%; min-width: 550px; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px 6px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: middle; }
        th { font-size: 12px; background-color: var(--admin-light); color: var(--admin-dark); text-transform: uppercase; font-weight: 600;}
        th:nth-child(1), td:nth-child(1) { text-align: left; padding-left: 15px; font-weight: 600; color: var(--text-main);}
        td:nth-child(6) { font-weight: 700; color: var(--admin-main);}
        
        .action-flex { display: flex; gap: 5px; justify-content: center; }
        .action-btn { border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-status.btn-unpaid { background: white; color: var(--danger); border: 1px solid var(--danger); }
        .btn-status.btn-paid { background: var(--success); color: white; border: 1px solid var(--success); }
        .btn-edit { background: var(--admin-light); color: var(--admin-main); padding: 6px 8px; }
        .btn-delete { background: #fee2e2; color: var(--danger); padding: 6px 8px; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 2000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); transform: translateY(-20px); transition: 0.3s;}
        .modal-overlay.show .modal-content { transform: translateY(0); }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--admin-dark); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--border-light); border-radius: 6px; font-size: 14px; font-family: 'Poppins'; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px;}
        .modal-actions button { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
        .btn-save { background: var(--admin-main); color: white; }
        .btn-cancel { background: #f1f5f9; color: var(--text-muted); }

        .notification { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 12px; opacity: 0; transform: translateY(20px); transition: 0.3s; z-index: 3000;}
        .notification.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="admin-badge">ADMIN</div>
            <h1>⚙️ Kawalan Penuh Trip</h1>
            <p>Tambah peserta, tukar nama, ubah jumlah atau kemas kini status bayaran.</p>
            <div class="db-status">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Menyambung ke Pangkalan Data...</span>
            </div>
        </div>

        <div class="dashboard">
            <div class="stat-card"><h3>Kutipan Sepatutnya</h3><div class="amount" id="total-expected">RM0</div></div>
            <div class="stat-card"><h3>Telah Dikutip</h3><div class="amount" id="total-collected" style="color: var(--success);">RM0</div></div>
            <div class="stat-card"><h3>Baki Belum Bayar</h3><div class="amount" id="total-pending" style="color: var(--danger);">RM0</div></div>
        </div>

        <div class="table-header-flex">
            <h3>Senarai Peserta</h3>
            <button class="btn-add" id="btn-add-new">➕ Tambah Peserta</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>👤 Nama</th><th>💰 Total</th><th>⚙️ Tindakan</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="3">Memuatkan data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-title" id="modal-title">Kemas Kini Peserta</div>
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label>Nama Peserta</label>
                <input type="text" id="edit-nama">
            </div>
            <div class="form-group">
                <label>Jumlah Bayaran (RM)</label>
                <input type="number" id="edit-jumlah">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="btn-cancel">Batal</button>
                <button class="btn-save" id="btn-save">Simpan Data</button>
            </div>
        </div>
    </div>

    <div class="notification" id="toast">✅ Berjaya!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // TAMPAL CONFIG ANDA DI SINI
        const firebaseConfig = {
            apiKey: "AIzaSyAdoSX32HqT2Aakdgyg7VS_Cs7N8ez6_bw",
            authDomain: "aki-aki-trail.firebaseapp.com",
            projectId: "aki-aki-trail",
            storageBucket: "aki-aki-trail.firebasestorage.app",
            messagingSenderId: "686708947350",
            appId: "1:686708947350:web:02ef0f8851f8b1908485b7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let peserta = [];
        let isAuthReady = false;

        function renderData() {
            const tableBody = document.getElementById('table-body');
            let html = '';
            let totalExpected = 0, totalCollected = 0;

            peserta.forEach(p => {
                totalExpected += p.jumlah || 0;
                if(p.telahBayar) totalCollected += p.jumlah || 0;
                
                html += `<tr>
                    <td>${p.nama}</td><td>RM ${p.jumlah || 0}</td>
                    <td>
                        <div class="action-flex">
                            <button class="action-btn btn-status ${p.telahBayar ? 'btn-paid' : 'btn-unpaid'}" data-id="${p.id}">${p.telahBayar ? '✅' : '❌'}</button>
                            <button class="action-btn btn-edit" data-id="${p.id}" data-nama="${p.nama}" data-jumlah="${p.jumlah}">✏️</button>
                            <button class="action-btn btn-delete" data-id="${p.id}">🗑️</button>
                        </div>
                    </td>
                </tr>`;
            });
            tableBody.innerHTML = html;
            document.getElementById('total-expected').textContent = `RM ${totalExpected}`;
            document.getElementById('total-collected').textContent = `RM ${totalCollected}`;
            document.getElementById('total-pending').textContent = `RM ${totalExpected - totalCollected}`;
        }

        document.getElementById('table-body').addEventListener('click', async (e) => {
            const id = e.target.closest('button')?.dataset.id;
            if(!id) return;

            if(e.target.classList.contains('btn-status')) {
                const p = peserta.find(x => x.id === id);
                await updateDoc(doc(db, 'payments', id), { telahBayar: !p.telahBayar });
            } else if(e.target.classList.contains('btn-edit')) {
                document.getElementById('edit-id').value = id;
                document.getElementById('edit-nama').value = e.target.dataset.nama;
                document.getElementById('edit-jumlah').value = e.target.dataset.jumlah;
                document.getElementById('modal-overlay').classList.add('show');
            } else if(e.target.classList.contains('btn-delete')) {
                if(confirm("Padam peserta?")) await deleteDoc(doc(db, 'payments', id));
            }
        });

        document.getElementById('btn-save').onclick = async () => {
            const id = document.getElementById('edit-id').value || "user_" + Date.now();
            await setDoc(doc(db, 'payments', id), {
                nama: document.getElementById('edit-nama').value,
                jumlah: parseInt(document.getElementById('edit-jumlah').value),
                telahBayar: false
            }, {merge: true});
            document.getElementById('modal-overlay').classList.remove('show');
        };

        document.getElementById('btn-add-new').onclick = () => {
            document.getElementById('edit-id').value = '';
            document.getElementById('modal-overlay').classList.add('show');
        };
        
        document.getElementById('btn-cancel').onclick = () => document.getElementById('modal-overlay').classList.remove('show');

        signInAnonymously(auth);
        onAuthStateChanged(auth, (user) => {
            if(!user) return;
            isAuthReady = true;
            document.getElementById('connection-text').textContent = "Berhubung secara Live 🟢";
            document.getElementById('connection-dot').style.backgroundColor = '#10b981';
            onSnapshot(collection(db, 'payments'), (snap) => {
                peserta = [];
                snap.forEach(d => peserta.push({id: d.id, ...d.data()}));
                renderData();
            });
        });
    </script>
</body>
</html>
