<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Aki-Aki Trip</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; --secondary: #10b981; --success: #10b981; --danger: #ef4444; 
            --admin-main: #4f46e5; --admin-light: #e0e7ff; --admin-dark: #3730a3;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a; --text-muted: #64748b;
            --border-light: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px 10px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .header { background: linear-gradient(135deg, var(--admin-main), var(--admin-dark)); border-radius: 12px; padding: 25px 20px; color: white; text-align: center; margin-bottom: 20px; position: relative; overflow: hidden; }
        .admin-badge { position: absolute; top: 15px; right: -35px; background: #ef4444; font-size: 11px; font-weight: bold; padding: 5px 40px; transform: rotate(45deg); letter-spacing: 1.5px; }
        .header h1 { font-size: 22px; margin-bottom: 8px; line-height: 1.3; font-weight: 700; }
        .header p { font-size: 13px; opacity: 0.9; }
        
        /* Connection Status */
        .db-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 15px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #fbbf24; } /* Default yellow/connecting */
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 15px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-light); }
        .stat-card h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 600;}
        .stat-card .amount { font-size: 18px; font-weight: 700; }
        
        .table-wrapper { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border-light); margin-bottom: 20px; overflow-x: auto; }
        table { width: 100%; min-width: 500px; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px 8px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: middle; }
        th { font-size: 13px; background-color: var(--admin-light); color: var(--admin-dark); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;}
        th:nth-child(1), td:nth-child(1) { text-align: left; padding-left: 15px; font-weight: 600; color: var(--text-main);}
        td:nth-child(6) { font-weight: 700; color: var(--admin-main);}
        .empty-dash { color: #cbd5e1; }
        
        .action-btn { border: none; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 110px; display: inline-flex; align-items: center; justify-content: center; gap: 5px;}
        .action-btn:active { transform: translateY(2px); }
        .btn-unpaid { background-color: white; color: var(--danger); border: 1.5px solid var(--danger); }
        .btn-unpaid:hover { background-color: #fef2f2; }
        .btn-paid { background-color: var(--success); color: white; border: 1.5px solid var(--success); }
        .btn-paid:hover { background-color: #059669; border-color: #059669;}
        
        .notification { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 12px; opacity: 0; transform: translateY(20px); transition: 0.3s; pointer-events: none; z-index: 1000;}
        .notification.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="admin-badge">ADMIN</div>
            <h1>⚙️ Kawalan Pembayaran</h1>
            <p>Klik butang status untuk mengemas kini rekod peserta.</p>
            <div class="db-status">
                <div class="status-dot" id="connection-dot"></div>
                <span id="connection-text">Menyambung ke Pangkalan Data...</span>
            </div>
        </div>

        <div class="dashboard">
            <div class="stat-card"><h3>Kutipan Sepatutnya</h3><div class="amount" id="total-expected">RM0</div></div>
            <div class="stat-card"><h3>Telah Dikutip</h3><div class="amount" id="total-collected" style="color: var(--success);">RM0</div></div>
            <div class="stat-card"><h3>Baki Belum Bayar</h3><div class="amount" id="total-pending" style="color: var(--danger);">RM0</div></div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>👤 Nama</th><th>🥾</th><th>🏠</th><th>🚙</th><th>🍔</th><th>💰 Total</th>
                        <th>⚙️ Tindakan Admin</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Loading state -->
                    <tr><td colspan="7">Memuatkan data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="notification" id="toast">✅ Status berjaya!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- DATA ASAS ---
        const senaraiNama = ["Boi", "Man", "Eja", "Boyo", "Liu", "Fry", "Kel", "Chiko", "Ipan"];
        const kumpulanCharter = ["Boi", "Man", "Eja", "Boyo"];
        const kosPerKepala = { hiking: 58, homestay: 34, mamam: 15, charter: 133 };

        let peserta = senaraiNama.map(nama => {
            const isCharter = kumpulanCharter.includes(nama);
            const bayaranCharter = isCharter ? kosPerKepala.charter : 0;
            const jumlah = kosPerKepala.hiking + kosPerKepala.homestay + bayaranCharter + kosPerKepala.mamam;
            return { nama, hiking: kosPerKepala.hiking, homestay: kosPerKepala.homestay, charter: bayaranCharter, mamam: kosPerKepala.mamam, jumlah, telahBayar: false };
        });

        // Global Variables
        let db;
        let appId;
        let isAuthReady = false;

        // --- RENDER UI ---
        function formatVal(nilai) { return nilai === 0 ? `<span class="empty-dash">-</span>` : nilai; }
        
        function renderData() {
            const tableBody = document.getElementById('table-body');
            let html = '';
            let jumlahSasaran = 0, jumlahDikutip = 0;

            peserta.forEach(orang => {
                const btnClass = orang.telahBayar ? 'btn-paid' : 'btn-unpaid';
                const btnText = orang.telahBayar ? '✅ Selesai' : '❌ Belum';
                
                jumlahSasaran += orang.jumlah;
                if(orang.telahBayar) jumlahDikutip += orang.jumlah;

                html += `
                    <tr>
                        <td>${orang.nama}</td><td>${formatVal(orang.hiking)}</td>
                        <td>${formatVal(orang.homestay)}</td><td>${formatVal(orang.charter)}</td>
                        <td>${formatVal(orang.mamam)}</td><td>${orang.jumlah}</td>
                        <td>
                            <button class="action-btn ${btnClass}" data-nama="${orang.nama}">${btnText}</button>
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
            document.getElementById('total-expected').textContent = `RM ${jumlahSasaran}`;
            document.getElementById('total-collected').textContent = `RM ${jumlahDikutip}`;
            document.getElementById('total-pending').textContent = `RM ${jumlahSasaran - jumlahDikutip}`;
        }

        renderData();

        function showToast(mesej, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = mesej;
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function updateConnectionStatus(isConnected, mesej) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            text.textContent = mesej;
            if (isConnected) {
                dot.style.backgroundColor = '#10b981'; // Green
            } else {
                dot.style.backgroundColor = '#ef4444'; // Red
            }
        }

        // --- LOGIK KLIK BUTANG ---
        document.getElementById('table-body').addEventListener('click', async (e) => {
            const btn = e.target.closest('.action-btn');
            if (!btn) return; 

            // ALARM JIKA TIADA SAMBUNGAN:
            if (!isAuthReady) {
                showToast("Sistem belum bersambung ke pangkalan data!", true);
                alert("Harap maklum: Firebase belum disambungkan. Jika anda membuka fail ini di komputer anda secara manual, anda perlu memasukkan kod konfigurasi Firebase di dalam script.");
                return; 
            }

            const nama = btn.getAttribute('data-nama');
            const person = peserta.find(p => p.nama === nama);
            
            if (person) {
                const statusBaru = !person.telahBayar;
                person.telahBayar = statusBaru; // Optimistic update
                renderData();

                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'payments', nama);
                    await setDoc(docRef, {
                        nama: nama,
                        telahBayar: statusBaru,
                        jumlah: person.jumlah,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    showToast(`Status ${nama} dikemas kini.`);
                } catch (error) {
                    console.error("Ralat Firebase:", error);
                    person.telahBayar = !statusBaru; // Revert if fail
                    renderData();
                    showToast("Gagal dikemas kini! Tiada kebenaran/sambungan.", true);
                }
            }
        });

        // --- FIREBASE INITIALIZATION ---
        try {
            // Semak adakah fail dijalankan dalam persekitaran yang betul
            if (typeof __firebase_config === 'undefined') {
                throw new Error("Missing Firebase Config");
            }

            const firebaseConfig = JSON.parse(__firebase_config);
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    updateConnectionStatus(false, "Gagal log masuk sistem.");
                    return;
                }
                
                isAuthReady = true;
                updateConnectionStatus(true, "Berhubung secara Live 🟢");
                
                const paymentsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'payments');
                onSnapshot(paymentsColRef, (snapshot) => {
                    if (!snapshot.empty) {
                        snapshot.forEach(doc => {
                            const dbData = doc.data();
                            const person = peserta.find(p => p.nama === dbData.nama);
                            if (person) person.telahBayar = dbData.telahBayar;
                        });
                        renderData();
                    }
                }, (error) => {
                    updateConnectionStatus(false, "Terputus dari server!");
                });
            });

        } catch (error) {
            console.error(error);
            updateConnectionStatus(false, "Sistem Dijalankan Tanpa Firebase (Mode Offline)");
        }
    </script>
</body>
</html>
