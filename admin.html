<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin Aki-Aki</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --danger: #ef4444; --success: #10b981;
            --bg-color: #f8fafc; --card-bg: #ffffff; --text-main: #0f172a;
            --border-light: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: none; }
        
        /* Modal Login */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid var(--border-light); border-radius: 8px; text-align: center; font-size: 20px; letter-spacing: 5px; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .error-msg { color: var(--danger); font-size: 13px; display: none; margin-bottom: 10px; }
        
        /* Admin Header & Table */
        .admin-header { background: #1e293b; color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .table-wrapper { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-light); }
        th { background: #f1f5f9; }
        td:first-child { font-weight: bold; text-align: left; }
        
        .status-btn { width: 35px; height: 35px; border-radius: 50%; border: none; font-size: 16px; cursor: pointer; color: white; font-weight: bold; transition: 0.2s; }
        .status-unpaid { background-color: var(--danger); }
        .status-paid { background-color: var(--success); }
        .status-btn:hover { transform: scale(1.1); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .info { text-align: center; margin-top: 15px; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>

    <!-- Skrin Login -->
    <div class="login-overlay" id="login-screen">
        <div class="login-box">
            <h2>Kunci Admin</h2>
            <p style="font-size: 12px; color: #64748b;">Akses Pengurusan Bayaran</p>
            <input type="password" id="pin-input" placeholder="PIN" />
            <div class="error-msg" id="error-msg">PIN salah!</div>
            <button onclick="verifyPin()">Sahkan Akses</button>
        </div>
    </div>

    <!-- Dashboard Admin -->
    <div class="container" id="admin-dashboard">
        <div class="admin-header">
            <h2>⚙️ Panel Kawalan Admin</h2>
            <p style="font-size: 13px; color: #cbd5e1;">Perubahan di sini akan terus dipaparkan (Live) kepada kawan-kawan.</p>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>Nama</th><th>Jumlah (RM)</th><th>Tindakan (Klik)</th></tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="3">Memuatkan data pangkalan awan...</td></tr>
                </tbody>
            </table>
        </div>
        <p class="info">Anda log masuk sebagai Admin | PIN: akiaki</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const senaraiNama = ["Boi", "Man", "Eja", "Boyo", "Liu", "Fry", "Kel", "Chiko", "Ipan"];
        const kumpulanCharter = ["Boi", "Man", "Eja", "Boyo"];
        const kosPerKepala = { hiking: 58, homestay: 34, mamam: 15, charter: 133 };

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'akiaki-trip';

        let adminAuthenticated = false;

        window.verifyPin = () => {
            const pin = document.getElementById('pin-input').value;
            if (pin === 'akiaki') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                adminAuthenticated = true;
                initFirebase(); 
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        async function initFirebase() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (!user) return;
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'payments');
                
                onSnapshot(colRef, async (snapshot) => {
                    if (snapshot.empty) {
                        for (let i = 0; i < senaraiNama.length; i++) {
                            const nama = senaraiNama[i];
                            const bayaranCharter = kumpulanCharter.includes(nama) ? kosPerKepala.charter : 0;
                            const jumlah = kosPerKepala.hiking + kosPerKepala.homestay + bayaranCharter + kosPerKepala.mamam;
                            
                            await setDoc(doc(colRef, nama), {
                                id: nama, index: i, nama: nama,
                                hiking: kosPerKepala.hiking, homestay: kosPerKepala.homestay,
                                charter: bayaranCharter, mamam: kosPerKepala.mamam,
                                jumlah: jumlah, telahBayar: false
                            });
                        }
                        return; 
                    }

                    let pesertaList = [];
                    snapshot.forEach(doc => pesertaList.push(doc.data()));
                    pesertaList.sort((a, b) => a.index - b.index);

                    let html = '';
                    pesertaList.forEach(orang => {
                        const btnClass = orang.telahBayar ? 'status-paid' : 'status-unpaid';
                        const icon = orang.telahBayar ? '✓' : '✗';
                        
                        html += `
                            <tr>
                                <td>${orang.nama}</td>
                                <td>RM ${orang.jumlah}</td>
                                <td>
                                    <button class="status-btn ${btnClass}" onclick="kemaskiniStatus('${orang.id}', ${orang.telahBayar})">
                                        ${icon}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById('table-body').innerHTML = html;
                });
            });
        }

        window.kemaskiniStatus = async (idDocument, currentStatus) => {
            if (!adminAuthenticated) return;
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'payments', idDocument);
            await updateDoc(docRef, { telahBayar: !currentStatus });
        };
    </script>
</body>
</html>
